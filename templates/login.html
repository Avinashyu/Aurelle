<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AURELLE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            color: #f5f0e8;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            background: #1c1c1c;
            border: 1px solid #333;
            padding: 45px;
            border-radius: 12px;
        }

        .brand {
            text-align: center;
            color: #d4af77;
            font-size: 32px;
            letter-spacing: 6px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 35px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 22px;
            background: #292929;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            border-color: #d4af77;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #d4af77;
            color: #111;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #e5c695;
        }

        .error {
            background: #4a2020;
            color: #ffaaaa;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #aaa;
            text-decoration: none;
        }

        .back:hover {
            color: #d4af77;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1 class="brand">AURELLE</h1>
        <p class="subtitle">Restaurant Management Login</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
    {% csrf_token %}

            <label for="username">Username</label>
            <input type="text"
                   id="username"
                   name="username"
                   placeholder="Enter your username"
                   required
                   autocomplete="username">

            <label for="password">Password</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter your password"
                   required
                   autocomplete="current-password">

            <button type="submit">Login</button>

        </form>

        <a href="{% url 'home' %}" class="back">
            ← Back to Restaurant
        </a>

    </div>

</body>
</html>
